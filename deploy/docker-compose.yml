services:
  # 游戏服务端（权威节点 + 静态前端 + API + WS 全走 8080）
  afserver:
    build:
      context: ..
      dockerfile: Dockerfile
    image: agentfarm2:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AF_SLOT=1
      - AF_NO_TUNNEL=1
      - AF_NO_GIT=1
      - AF_DATA_DIR=/data
      - AF_CLIENT_DIR=/app/client
    volumes:
      # 运行时生成数据（存档/账号/agent-notes）持久化；
      # 配置数据（items.json 等）已 COPY 进镜像 /data/，挂载会遮蔽，故不在此挂
      - ./data:/data
    # Fly.io 部署时改用 volume（不映射端口）：
    # 见 deploy/FLY.md

  # HTTPS 反向代理 + 自动证书 + WebSocket 透传
  # 域名通过 CADDY_DOMAIN 环境变量注入（.env 里设 CADDY_DOMAIN=game.example.com）
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - afserver
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:?请在 .env 中设 CADDY_DOMAIN=你的域名}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # 把前端静态文件挂给 caddy（与 afserver 同一套，避免双份）
      - ../client:/srv/agentfarm/client:ro

volumes:
  caddy_data:
  caddy_config:
